name: Update README

on:
  schedule:
    # 00:00 UTC = 09:00 JST, once a day
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Regenerate README and banners
        run: node scripts/update-readme.mjs

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain README.md assets/banner.svg)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/banner.svg
          git commit -m "🤖 Refresh README and banner"
          git push
