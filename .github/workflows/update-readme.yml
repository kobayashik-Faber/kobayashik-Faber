name: Update README

on:
  schedule:
    # 00:00 UTC = 09:00 JST, once a day
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Regenerate README and banners
        run: node scripts/update-readme.mjs

      - name: Commit via GitHub API if changed
        uses: actions/github-script@v7
        with:
          script: |
            const commit = require('./.github/scripts/commit-verified.cjs');
            await commit({ github, context, core });
